name: Build Monarch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  repo:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    environment:
      name: github-pages
      url: https://horizzon3507.github.io/monarch/
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib sudo
      - name: Build monarch repo
        run: |
          useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder .
          sudo -u builder ./repo/build-repo.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo/out
      - uses: actions/deploy-pages@v4

  iso:
    needs: repo
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install archiso
        run: pacman -Syu --noconfirm --needed archiso git
      - name: Prepare profile
        run: |
          # Our profile is an overlay on releng: pull in the bits we don't fork
          # (bootloader templates, initrd hooks, live-env helper scripts)
          # and keep our own airootfs files where they overlap.
          cp -rn /usr/share/archiso/configs/releng/{grub,syslinux,efiboot,bootstrap_image.*} archiso/ 2>/dev/null || true
          cp -rn /usr/share/archiso/configs/releng/airootfs/. archiso/airootfs/
      - name: Build ISO
        run: mkarchiso -v -w /tmp/work -o out archiso
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-iso
          path: out/*.iso
